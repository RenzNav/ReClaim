<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}ReClaim{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons for navigation and interface elements -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS for ReClaim -->
     <style>
        /* Fixed bottom navigation bar */
        .bottom-navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ffffff;
            border-top: 1px solid #dee2e6;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 4px;
            z-index: 1000;
        }

        /* Individual navigation items */
        .bottom-nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            text-decoration: none;
            color: #6c757d;
            font-size: 11px;
            padding: 3px 0;
        }

        /* Navigation icons */
        .bottom-nav-item i {
            font-size: 21px;
        }

        /* Highlight the currently selected page */
        .bottom-nav-item.active {
            color: #198754;
            font-weight: 600;
        }

        /* Central Add Listing button */
        .add-nav-item {
            color: #198754;
            font-weight: 600;
        }

        .add-nav-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: #198754;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .add-nav-icon i {
            font-size: 25px;
        }

        /* Leave room for the fixed navigation */
        body {
            padding-bottom: 85px;
        }
    </style>
</head>
<body>

    <!-- Top navigation containing branding and account controls -->
    <nav class="navbar bg-light border-bottom">
        <div class="container">

            <a class="navbar-brand fw-bold" href="{% url 'home' %}">
                ReClaim
            </a>

            <div class="d-flex align-items-center gap-2">

                {% if user.is_authenticated %}
                    <span class="small">
                        Hello, {{ user.username }}
                    </span>

                    <!-- Logout requires POST -->
                    <form method="POST" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit"
                                class="btn btn-outline-danger btn-sm">
                            Logout
                        </button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}"
                    class="btn btn-outline-success btn-sm">
                        Login
                    </a>

                    <a href="{% url 'register' %}"
                    class="btn btn-success btn-sm">
                        Register
                    </a>
                {% endif %}

            </div>
        </div>
    </nav>

    <!-- Main content area -->
    <main class="container mt-4">
        {% block content %}
        {% endblock %}

        <!-- Fixed bottom navigation -->
        <nav class="bottom-navbar">

            <a href="{% url 'home' %}"
            class="bottom-nav-item {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
                <i class="bi bi-house-door"></i>
                <span>Home</span>
            </a>

            <a href="{% url 'browse' %}"
            class="bottom-nav-item {% if request.resolver_match.url_name == 'browse' %}active{% endif %}">
                <i class="bi bi-search"></i>
                <span>Browse</span>
            </a>

            <!-- Highlighted central listing button -->
            <a href="{% url 'create_listing' %}" class="bottom-nav-item add-nav-item">
                <span class="add-nav-icon">
                    <i class="bi bi-plus-lg"></i>
                </span>
                <span>Add Listing</span>
            </a>

            <a href="{% url 'requests' %}"
            class="bottom-nav-item {% if request.resolver_match.url_name == 'requests' %}active{% endif %}">
                <i class="bi bi-bell"></i>
                <span>Requests</span>
            </a>

            <a href="{% url 'my_listings' %}"
            class="bottom-nav-item {% if request.resolver_match.url_name == 'my_listings' %}active{% endif %}">
                <i class="bi bi-person"></i>
                <span>My Listings</span>
            </a>

        </nav>

    </main>

</body>
</html>
