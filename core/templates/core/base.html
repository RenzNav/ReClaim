<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}ReClaim{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons for navigation and interface elements -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS for ReClaim -->
    <style>
        /* ReClaim colour palette */
        :root {
            --reclaim-primary: #245C4B;
            --reclaim-secondary: #84A98C;
            --reclaim-background: #F6F5EF;
            --reclaim-accent: #D4AA70;
            --reclaim-text: #263832;
            --reclaim-white: #FFFFFF;
            --reclaim-border: #DEE5DC;
        }

        /* Global appearance and space for bottom navigation */
        body {
            background-color: var(--reclaim-background);
            color: var(--reclaim-text);
            padding-bottom: 85px;
        }

        /* Top navigation bar */
        .top-navbar {
            background-color: var(--reclaim-primary);
        }

        .top-navbar .navbar-brand,
        .top-navbar span {
            color: var(--reclaim-white);
        }

        /* Account buttons in the top navigation */
        .top-navbar .btn-outline-danger,
        .top-navbar .btn-outline-success,
        .top-navbar .btn-success {
            color: var(--reclaim-white);
            border-color: var(--reclaim-white);
        }

        .top-navbar .btn-outline-danger:hover,
        .top-navbar .btn-outline-success:hover,
        .top-navbar .btn-success:hover {
            background-color: var(--reclaim-white);
            color: var(--reclaim-primary);
            border-color: var(--reclaim-white);
        }

        /* Primary action buttons */
        .btn-success {
            --bs-btn-color: #ffffff;
            --bs-btn-bg: var(--reclaim-primary);
            --bs-btn-border-color: var(--reclaim-primary);
            --bs-btn-hover-bg: #1B473A;
            --bs-btn-hover-border-color: #1B473A;
            --bs-btn-active-bg: #163B30;
            --bs-btn-active-border-color: #163B30;
        }

        /* Secondary action buttons */
        .btn-outline-success {
            --bs-btn-color: var(--reclaim-primary);
            --bs-btn-border-color: var(--reclaim-primary);
            --bs-btn-hover-color: #ffffff;
            --bs-btn-hover-bg: var(--reclaim-primary);
            --bs-btn-hover-border-color: var(--reclaim-primary);
            --bs-btn-active-color: #ffffff;
            --bs-btn-active-bg: var(--reclaim-primary);
            --bs-btn-active-border-color: var(--reclaim-primary);
        }

        /* Override Bootstrap's default green */
        .text-success {
            color: var(--reclaim-primary) !important;
        }

        .bg-success {
            background-color: var(--reclaim-primary) !important;
        }

        .bg-success-subtle {
            background-color: #E1EBE3 !important;
        }

        /* Consistent appearance for cards */
        .card {
            background-color: var(--reclaim-white);
            color: var(--reclaim-text);
            border-color: var(--reclaim-border);
            border-radius: 12px;
        }

        /* Soft gold highlight for deposit values */
        .deposit-value {
            background-color: #F3E5CF;
            color: var(--reclaim-text);
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: 600;
        }

        /* Form input appearance */
        .form-control,
        .form-select {
            color: var(--reclaim-text);
            border-color: var(--reclaim-border);
        }

        /* Highlight selected form inputs */
        .form-control:focus,
        .form-select:focus {
            color: var(--reclaim-text);
            border-color: var(--reclaim-secondary);
            box-shadow: 0 0 0 0.2rem rgba(36, 92, 75, 0.15);
        }

        /* Fixed bottom navigation bar */
        .bottom-navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--reclaim-white);
            border-top: 1px solid var(--reclaim-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 4px;
            z-index: 1000;
        }

        /* Individual navigation items */
        .bottom-nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            text-decoration: none;
            color: #6c757d;
            font-size: 11px;
            padding: 3px 0;
        }

        /* Navigation icons */
        .bottom-nav-item i {
            font-size: 21px;
        }

        /* Highlight the currently selected page */
        .bottom-nav-item.active {
            color: var(--reclaim-primary);
            font-weight: 600;
        }

        /* Navigation item hover state */
        .bottom-nav-item:hover {
            color: var(--reclaim-primary);
        }

        /* Central Add Listing button */
        .add-nav-item {
            color: var(--reclaim-primary);
            font-weight: 600;
        }

        .add-nav-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--reclaim-primary);
            color: var(--reclaim-white);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Add Listing button icon */
        .add-nav-icon i {
            font-size: 25px;
        }
    </style>

    <!-- Additional resources for individual pages -->
    {% block extra_head %}
    {% endblock %}
</head>
<body>

    <!-- Top navigation containing branding and account controls -->
    <nav class="navbar top-navbar border-bottom">
        <div class="container">

            <a class="navbar-brand fw-bold" href="{% url 'home' %}">
                ReClaim
            </a>

            <div class="d-flex align-items-center gap-2">

                {% if user.is_authenticated %}
                    <span class="small">
                        Hello, {{ user.username }}
                    </span>

                    <!-- Logout requires POST -->
                    <form method="POST" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit"
                                class="btn btn-outline-danger btn-sm">
                            Logout
                        </button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}"
                    class="btn btn-outline-success btn-sm">
                        Login
                    </a>

                    <a href="{% url 'register' %}"
                    class="btn btn-success btn-sm">
                        Register
                    </a>
                {% endif %}

            </div>
        </div>
    </nav>

    <!-- Main content area -->
    <main class="container mt-4">
        {% block content %}
        {% endblock %}

        <!-- Fixed bottom navigation -->
        <nav class="bottom-navbar">

            <a href="{% url 'home' %}"
            class="bottom-nav-item {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
                <i class="bi bi-house-door"></i>
                <span>Home</span>
            </a>

            <a href="{% url 'browse' %}"
            class="bottom-nav-item {% if request.resolver_match.url_name == 'browse' %}active{% endif %}">
                <i class="bi bi-search"></i>
                <span>Browse</span>
            </a>

            <!-- Highlighted central listing button -->
            <a href="{% url 'create_listing' %}" class="bottom-nav-item add-nav-item">
                <span class="add-nav-icon">
                    <i class="bi bi-plus-lg"></i>
                </span>
                <span>Add Listing</span>
            </a>

            <a href="{% url 'requests' %}"
            class="bottom-nav-item {% if request.resolver_match.url_name == 'requests' %}active{% endif %}">
                <i class="bi bi-bell"></i>
                <span>Requests</span>
            </a>

            <a href="{% url 'my_listings' %}"
            class="bottom-nav-item {% if request.resolver_match.url_name == 'my_listings' %}active{% endif %}">
                <i class="bi bi-person"></i>
                <span>My Listings</span>
            </a>

        </nav>

    </main>

</body>
</html>
